    back: 49
    # BIN slots
    buy-button: 31
    partial-buy-button: 30
    set-amount: 32
    # BID slots
    bid-history: 33
    submit-bid: 29
    bid-explanation: 31
    cancel-auction: 31
    
  materials:
    buy-afford: TURTLE_SCUTE
    buy-cannot-afford: ARMADILLO_SCUTE
