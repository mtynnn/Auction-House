# ══════════════════════════════════════════════════════════════════════════════
# AuctionHouse - Slot Configuration
# Define positions and materials for all GUI elements
# ══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════
# AUCTION HOUSE GUI
# ═══════════════════════════════════════════
AuctionHouseGUI:
  size: 54  # 6 rows
  
  # Item display slots (where auction items appear)
  # Supports individual values (10) and ranges ("10-35")
  item-slots:
    - "0-44"

  
  slots:
    search: 45
    sort: 46
    previous-page: 48
    refresh: 49
    next-page: 50
    filter: 52
    my-auctions: 53
    
  materials:
    search: OAK_SIGN
    search-active: SPRUCE_SIGN
    sort: HOPPER
    previous-page: ARROW
    refresh: NETHER_STAR
    next-page: ARROW
    filter-all: POWERED_RAIL
    filter-bin: GOLD_INGOT
    filter-auctions: GOLD_BLOCK
    my-auctions: ENDER_CHEST
    filler: AIR
    command-block: STRUCTURE_BLOCK

# ═══════════════════════════════════════════
# MY AUCTIONS GUI
# ═══════════════════════════════════════════
MyAuctionsGUI:
  size: 54
  
  item-slots:
    - "0-44"
    
  slots:
    back: 45
    sort: 46
    previous-page: 48
    refresh: 49
    next-page: 50
    collect-all: 52
    info: 53
    
  materials:
    back: ARROW
    sort: HOPPER
    previous-page: ARROW
    refresh: NETHER_STAR
    next-page: ARROW
    collect-all: GOLDEN_CARROT
    info: PAPER
    filler: AIR

# ═══════════════════════════════════════════
# MY BIDS GUI
# ═══════════════════════════════════════════
MyBidsGUI:
  size: 54
  
  # item-slots and pagination controls are dynamically generated based on size
  item-slots:
    - "0-44"
    
  slots:
    back: 45
    # previous-page and next-page are calculated dynamically but can be defined here for reference
    previous-page: 45
    refresh: 49
    next-page: 53
    
  materials:
    back: ARROW
    previous-page: ARROW
    refresh: NETHER_STAR
    next-page: ARROW
    filler: AIR

