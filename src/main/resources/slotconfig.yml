    bid-history: FILLED_MAP
    submit-bid: GOLD_NUGGET
    bid-explanation: GOLD_INGOT
    cannot-afford-bid: ARMADILLO_SCUTE
    top-bid: GOLD_BLOCK
    cancel-auction: RED_CONCRETE
    back: ARROW
    filler: AIR

