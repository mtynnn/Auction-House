# ══════════════════════════════════════════════════════════════════════════════
# AuctionHouse Configuration
# ══════════════════════════════════════════════════════════════════════════════

# General
# tax: REMOVED - Now shows transaction history in My Auctions GUI
default-max-auctions: 3
admin-permission: "auctionhouse.admin"

# Notifications
sold-message: true
auto-collect: false
auction-announcements: true

# GUI
use-sign-gui: true
search-sign:
  lines:
    - ''
    - '↑↑↑↑↑↑↑↑↑↑↑↑↑'
    - '       Buscar      '
    - ''
partial-selling: false

# BIN Auctions (Buy It Now)
bin-auctions: true
bin-auction-duration-hours: -1         # -1 = infinite
min-bin: 100
max-price: 100000000

# Price Protection (automatic, based on average sale history)
price-protection:
  enabled: true
  max-multiplier: 10          # reject if price > 10x the average
  min-sales-required: 5       # need 5+ past sales to activate

# Bid Auctions
bid-auctions: false
bid-auction-duration-hours: 48          # -1 = infinite
min-bid: 1
bid-increase-percent: 25
last-bid-extra-time: 60

# Expiration
auction-setup-time: 3
expired-item-check-interval: 15         # minutes
expired-item-retention-days: 7

# Display
display-update: 20                      # ticks (20 = 1s)

# Database
database:
  pool-size: 10                         # HikariCP connection pool size
  connection-timeout: 30000             # milliseconds (30s)

# Debug
debug:
  enabled: false                        # Enables verbose debug logging (/ah debug on|off)
  log-corrupted-items: false            # Log items that fail to load
  max-stack-size: 576                   # Max items in one auction (9 inv * 64)

# Format
format-money:
  k: k
  m: M
  b: B
  t: T
  show-decimals: false

time-units:
  days: ᴅɪᴀs
  day: ᴅɪᴀ
  hours: ʜᴏʀᴀs
  hour: ʜᴏʀᴀ
  minutes: ᴍɪɴᴜᴛᴏs
  minute: ᴍɪɴᴜᴛᴏ
  seconds: sᴇɢᴜɴᴅᴏs
  second: sᴇɢᴜɴᴅᴏ
  never: ɴᴜɴᴄᴀ
